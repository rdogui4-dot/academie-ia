<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Vérification officielle d'un certificat — Académie IA Générative">
<title>Vérification du certificat — Académie IA Générative</title>

<link rel="stylesheet" href="../style.css">

<style>

.verify-page {
    max-width: 820px;
    margin: 70px auto;
    padding: 0 20px 70px;
}

.verify-card {
    position: relative;
    overflow: hidden;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 22px;
    padding: 44px;
    box-shadow: 0 18px 50px rgba(15,23,42,.10);
    text-align: center;
}

.verify-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg,#4B0082,#0066FF,#4CAF50);
}

.verify-icon {
    width: 82px;
    height: 82px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(76,175,80,.12);
    font-size: 38px;
}

.verify-card h2 {
    margin-bottom: 10px;
    color: #111827;
}

.verify-status {
    display: inline-flex;
    padding: 7px 12px;
    border-radius: 999px;
    background: #fef3c7;
    color: #92400e;
    font-weight: 800;
    font-size: 13px;
}

.verify-id {
    margin: 25px 0 12px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .03em;
    color: #4B0082;
    word-break: break-word;
}

.verify-note {
    margin-top: 18px;
    color: #64748b;
    line-height: 1.7;
}

.verify-data {
    display: none;
    margin-top: 30px;
    text-align: left;
    border-top: 1px solid #e2e8f0;
    padding-top: 25px;
}

.verify-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #eef2f7;
}

.verify-label {
    font-weight: 700;
    color: #475569;
}

.verify-value {
    color: #111827;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.verify-actions {
    margin-top: 30px;
}

.invalid .verify-icon,
.error .verify-icon {
    background: #fee2e2;
}

.invalid .verify-status,
.error .verify-status {
    background: #fef2f2;
    color: #991b1b;
}

.valid .verify-status {
    background: #f0fdf4;
    color: #166534;
}

@media (max-width: 640px) {

    .verify-page {
        margin: 35px auto;
    }

    .verify-card {
        padding: 28px 20px;
    }

    .verify-row {
        grid-template-columns: 1fr;
        gap: 4px;
    }

    .verify-id {
        font-size: 18px;
    }

}

</style>

</head>


<body>

<header class="site-header">

    <div class="container">

        <h1>Académie IA Générative</h1>

        <nav>
            <a href="../index.html">Accueil</a>
            <a href="n1.html">Formation N1</a>
        </nav>

    </div>

</header>


<main class="verify-page">

<section class="verify-card" id="verificationCard">

    <div class="verify-icon" id="verifyIcon">🔎</div>

    <div class="verify-status" id="verifyStatus">Vérification en cours</div>

    <h2>Vérification officielle du certificat</h2>

    <p class="verify-id" id="verifyId">—</p>

    <p class="verify-note" id="verifyNote">
        Connexion au registre officiel des certificats…
    </p>


    <div class="verify-data" id="verifyData">

        <div class="verify-row">
            <div class="verify-label">Titulaire</div>
            <div class="verify-value" id="dataNom">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Formation</div>
            <div class="verify-value" id="dataFormation">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Niveau</div>
            <div class="verify-value" id="dataNiveau">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Durée</div>
            <div class="verify-value" id="dataDuree">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Score</div>
            <div class="verify-value" id="dataScore">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Date de délivrance</div>
            <div class="verify-value" id="dataDate">—</div>
        </div>

        <div class="verify-row">
            <div class="verify-label">Statut</div>
            <div class="verify-value" id="dataStatut">—</div>
        </div>

    </div>


    <div class="verify-actions">

        <a
            href="certificat-n1.html"
            class="complete-btn"
        >
            ← Retour au certificat
        </a>

    </div>

</section>

</main>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbzWKdww6nKuinpU1r6Mes7fdWACohdPscHTklShW7R12TFtVUmiGrmrAnrhLqI-ele4/exec";


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    (params.get("id") || "")
        .trim()
        .toUpperCase();

const card =
    document.getElementById(
        "verificationCard"
    );

const icon =
    document.getElementById(
        "verifyIcon"
    );

const status =
    document.getElementById(
        "verifyStatus"
    );

const verifyId =
    document.getElementById(
        "verifyId"
    );

const note =
    document.getElementById(
        "verifyNote"
    );

const verifyData =
    document.getElementById(
        "verifyData"
    );


/* =========================================================
   AFFICHER L'ID
   ========================================================= */

verifyId.textContent =
    id || "Aucun identifiant fourni";


/* =========================================================
   CALLBACK JSONP
   ========================================================= */

function recevoirVerification(data) {

    if (!data || !data.success) {

        card.classList.add("invalid");

        icon.textContent = "⚠️";

        status.textContent =
            "Certificat introuvable";

        note.textContent =
            data && data.message
                ? data.message
                : "Aucun certificat correspondant à cet identifiant n'a été trouvé dans le registre officiel.";

        return;

    }


    const certificate =
        data.certificate || {};


    if (
        String(certificate.statut || "")
            .toUpperCase() !== "VALIDE"
    ) {

        card.classList.add("invalid");

        icon.textContent = "⚠️";

        status.textContent =
            "Certificat non valide";

        note.textContent =
            "Le certificat existe dans le registre, mais son statut n'est pas VALIDE.";

    } else {

        card.classList.add("valid");

        icon.textContent = "✅";

        status.textContent =
            "Certificat authentifié";

        note.textContent =
            "Ce certificat a été retrouvé dans le registre officiel de l'Académie IA Générative.";

    }


    document.getElementById("dataNom").textContent =
        certificate.nom || "—";

    document.getElementById("dataFormation").textContent =
        certificate.formation || "—";

    document.getElementById("dataNiveau").textContent =
        certificate.niveau || "—";

    document.getElementById("dataDuree").textContent =
        certificate.duree || "—";

    document.getElementById("dataScore").textContent =
        certificate.score || "—";

    document.getElementById("dataDate").textContent =
        formatDate(certificate.date);

    document.getElementById("dataStatut").textContent =
        certificate.statut || "—";


    verifyData.style.display =
        "block";

}


/* =========================================================
   FORMATAGE DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {
        return "—";
    }

    return String(value);

}


/* =========================================================
   VALIDATION DE L'ID
   ========================================================= */

const validId =
    /^AIG-N1-20\d{2}-[A-F0-9]{12}$/i
        .test(id);


if (!id) {

    card.classList.add("invalid");

    icon.textContent = "⚠️";

    status.textContent =
        "Identifiant manquant";

    note.textContent =
        "Aucun identifiant de certificat n'a été transmis dans l'adresse de vérification.";

} else if (!validId) {

    card.classList.add("invalid");

    icon.textContent = "⚠️";

    status.textContent =
        "Identifiant invalide";

    note.textContent =
        "Le format de l'identifiant ne correspond pas à celui d'un certificat N1.";

} else {

    /* =====================================================
       APPEL JSONP VERS APPS SCRIPT
       ===================================================== */

    const script =
        document.createElement("script");

    const callbackName =
        "recevoirVerification";

    script.src =
        API_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&prefix=" +
        encodeURIComponent(callbackName);

    script.onerror =
        function () {

            card.classList.add("error");

            icon.textContent = "⚠️";

            status.textContent =
                "Service de vérification indisponible";

            note.textContent =
                "Impossible de contacter le registre officiel. Réessayez plus tard.";

        };

    document.body.appendChild(script);

}

</script>

</body>
</html>
